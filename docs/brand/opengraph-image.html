<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box}
 html,body{margin:0;padding:0}
 body{width:1200px;height:630px;background:#fafaf9;font-family:"IBM Plex Sans",system-ui;color:#16181c;
      display:grid;grid-template-columns:1fr 448px;gap:48px;padding:64px 64px 64px 72px;overflow:hidden}
 .left{display:flex;flex-direction:column;justify-content:center}
 .lock{display:flex;align-items:center;gap:17px}
 .wm{font-family:Newsreader,serif;font-style:italic;font-weight:600;font-size:54px;line-height:1;
     letter-spacing:-.02em;color:#1f4e79}
 .sub{margin-top:28px;font-size:26px;line-height:1.45;color:#595c63;max-width:28ch}
 .out{margin-top:44px;padding-top:22px;border-top:1px solid #c9c9c5}
 .cap{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#595c63}
 .stmt{margin-top:12px;font-family:Newsreader,serif;font-size:21px;line-height:1.5;color:#16181c;max-width:46ch}
 .stmt b{font-weight:600}
 table{border-collapse:collapse;width:100%;align-self:center}
 caption{caption-side:top;text-align:left;font-size:12px;font-weight:600;letter-spacing:.08em;
         text-transform:uppercase;color:#595c63;padding-bottom:11px}
 th.role{font-weight:400;font-size:15px;color:#16181c;text-align:left;padding:0 14px 0 0;white-space:nowrap}
 thead tr{border-bottom:1px solid #c9c9c5}
 thead th.ini{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:13px;color:#595c63;
              padding:0 0 9px;width:52px}
 tfoot td{border-top:1px solid #c9c9c5;padding-top:11px;font-size:12px;color:#595c63}
 tbody tr td{padding:2px 0}
 .cell{width:44px;height:22px;border-radius:2px;margin:0 auto}
 tbody tr:first-child td,tbody tr:first-child th{padding-top:9px}
</style>
<div class="left">
  <div class="lock">
    <svg width="44" height="44" viewBox="0 0 32 32"><title>CRediT Matrix</title>
      <rect x="3" y="3" width="8" height="8" rx="1" fill="#1f4e79"/><rect x="12" y="3" width="8" height="8" rx="1" fill="#6283a1"/><rect x="21" y="3" width="8" height="8" rx="1" fill="#a5b8c9"/>
      <rect x="3" y="12" width="8" height="8" rx="1" fill="#6283a1"/><rect x="12" y="12" width="8" height="8" rx="1" fill="#1f4e79"/><rect x="21" y="12" width="8" height="8" rx="1" fill="#ececea"/>
      <rect x="3" y="21" width="8" height="8" rx="1" fill="#a5b8c9"/><rect x="12" y="21" width="8" height="8" rx="1" fill="#ececea"/><rect x="21" y="21" width="8" height="8" rx="1" fill="#1f4e79"/>
    </svg>
    <span class="wm">CRediT Matrix</span>
  </div>
  <p class="sub">The contribution heatmap, and the statement that goes with it.</p>
  <div class="out">
    <div class="cap">Generated statement</div>
    <p class="stmt"><b>CRediT:</b> Jane A. Smith: Conceptualization, Methodology (Equal), Supervision (Supporting), Writing – original draft; Bob White: Data curation, Formal analysis (Equal), …</p>
  </div>
</div>
<table id="m"><caption>Contributions</caption></table>
<script>"use strict";
const L='#1f4e79',E='#6283a1',S='#a5b8c9',N='#ececea';
const roles=["Conceptualization","Data curation","Formal analysis","Funding acquisition","Investigation","Methodology","Project administration","Resources","Software","Supervision","Validation","Visualization","Writing – original draft","Writing – review & editing"];
const data={"Jane A. Smith":{Conceptualization:100,Methodology:66,"Writing – original draft":100,Supervision:33},
 "Bob White":{Investigation:100,"Data curation":100,Software:66,"Formal analysis":66},
 "Carol Davis":{"Funding acquisition":100,"Project administration":100,"Writing – review & editing":100,Resources:66}};
const ini={"Jane A. Smith":"JAS","Bob White":"BW","Carol Davis":"CD"};
const fill=s=>s>66?L:s>33?E:s>0?S:N;
const names=Object.keys(data);
document.getElementById('m').innerHTML+=
 `<thead><tr><th class="role"></th>${names.map(n=>`<th class="ini">${ini[n]}</th>`).join('')}</tr></thead>`+
 `<tbody>${roles.map(r=>`<tr><th class="role">${r}</th>${names.map(n=>`<td><div class="cell" style="background:${fill(data[n][r]||0)}"></div></td>`).join('')}</tr>`).join('')}</tbody>`+
 `<tfoot><tr><td colspan="4">Sample data. Lead, equal, and supporting shown by intensity.</td></tr></tfoot>`;
</script>
