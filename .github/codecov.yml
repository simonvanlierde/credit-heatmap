# Coverage comes from two Vitest projects: the app layer (`src/lib`,
# `src/store`) and `packages/core`. Anything outside those never appears in the
# lcov reports, so it is absent from the totals rather than counted as
# uncovered - no ignore rules needed for it.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 0%
        # A docs- or config-only PR touches no measured line; don't fail it.
        if_not_found: success

# One tidy comment, and only when the numbers actually moved.
comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true
  hide_project_coverage: false

ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.d.ts"
  - "**/test-setup.ts"
  - "e2e/**"
