name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test
        run: pnpm biome check . && pnpm typecheck && pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info,coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser download is ~130MB and never varies for a given Playwright
      # version, so key the cache on the lockfile. `--with-deps` still runs on a
      # hit: the apt system libraries live outside this path.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Only Chromium is needed; skip the other browsers.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # This job builds the app before the tests run (see playwright.config.ts),
      # so it wants the same incremental cache the build job keeps.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # The whole Playwright suite gates every push/PR: the axe scans *and*
      # the critical-workflow specs (import, undo, ORCID lookup, persistence,
      # bulk assign, export). Running only a11y.spec.ts here let a regression
      # in any of those merge with CI fully green, since e2e.yml is opt-in.
      #
      # Workers are left at Playwright's default (half the runner's cores).
      # Against a production build the suite runs 62s serially and 46s on two
      # workers, and the one test that failed under load was an unscoped
      # locator, not a shared-state problem: `retries: 2` covers the rest.
      - name: Run Playwright suite
        env:
          CI: true
        run: pnpm exec playwright test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Persist Next.js' incremental build cache (.next/cache) across runs so
      # rebuilds are faster. Keyed on lockfile + source; falls back to the last
      # cache for the same deps when only source changed.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Build the actual artifact that ships (Cloudflare Workers bundle via
      # OpenNext), not just `next build`, so worker-bundling failures surface in CI.
      - name: Build
        run: pnpm exec opennextjs-cloudflare build

      # Nothing else in CI reads wrangler.jsonc, and the real deploy runs from
      # Cloudflare Builds on merge to main: a bad binding, route or `main` path
      # would first fail in production. The dry run needs no credentials.
      - name: Validate Worker config
        run: pnpm exec wrangler deploy --dry-run
